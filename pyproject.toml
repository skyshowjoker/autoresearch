[project]
name = "autoquant-research"
version = "0.1.0"
description = "Autonomous, reproducible quantitative-strategy research on Backtrader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autoquant = "autoquant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
