<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoQuant Research Lab</title>
<style>body{font:14px system-ui;margin:0;background:#10151c;color:#e8eef5}header{padding:20px 28px;background:#182431}main{padding:20px 28px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#182431;border:1px solid #2b3b4c;border-radius:10px;padding:16px}.muted{color:#9aabba}table{width:100%;border-collapse:collapse;margin-top:18px;background:#182431}th,td{text-align:left;padding:10px;border-bottom:1px solid #2b3b4c}code{color:#91d7ff}.ok{color:#7ee787}.bad{color:#ff7b72}button{background:#2676c9;color:white;border:0;border-radius:5px;padding:5px 9px;cursor:pointer}#detail{margin-top:18px;display:none}.files{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}pre{background:#0b1016;padding:14px;overflow:auto;max-height:500px;white-space:pre-wrap}</style></head>
<body><header><h1>AutoQuant Research Lab</h1><div class="muted">实验轨迹 · 版本 lineage · 回测审计</div></header><main><div class="grid"><div class="card"><div class="muted">实验总数</div><strong id="count">-</strong></div><div class="card"><div class="muted">成功实验</div><strong id="success">-</strong></div><div class="card"><div class="muted">最佳分数</div><strong id="best">-</strong></div><div class="card"><div class="muted">服务状态</div><strong class="ok" id="health">checking</strong></div></div><table><thead><tr><th>实验</th><th>策略版本</th><th>状态</th><th>决策</th><th>分数</th><th>产物</th></tr></thead><tbody id="rows"></tbody></table><section id="detail"><h2 id="detailTitle"></h2><div id="files" class="files"></div><pre id="preview">选择文件查看内容</pre></section></main>
<script>async function preview(id,file){const r=await fetch('/api/experiments/'+id+'/artifacts/'+file.split('/').map(encodeURIComponent).join('/'));const x=await r.json();document.querySelector('#preview').textContent=x.content||('二进制文件，大小 '+x.size+' 字节');}async function detail(id){const r=await fetch('/api/experiments/'+id+'/artifacts');const x=await r.json();document.querySelector('#detail').style.display='block';document.querySelector('#detailTitle').textContent='实验产物：'+id;document.querySelector('#files').innerHTML=x.items.map(f=>`<button onclick="preview('${id}',${JSON.stringify(f)})">${f}</button>`).join('');}async function load(){try{const h=await fetch('/api/health');document.querySelector('#health').textContent=(await h.json()).status;const data=(await (await fetch('/api/experiments')).json()).items||[];document.querySelector('#count').textContent=data.length;const good=data.filter(x=>x.status==='success');document.querySelector('#success').textContent=good.length;document.querySelector('#best').textContent=good.length?Math.max(...good.map(x=>x.score??-Infinity)).toFixed(4):'-';document.querySelector('#rows').innerHTML=data.map(x=>`<tr><td><button onclick="detail('${x.experiment_id}')">${x.experiment_id}</button></td><td>${x.strategy_version_id}</td><td class="${x.status==='success'?'ok':'bad'}">${x.status}</td><td>${x.decision||'-'}</td><td>${x.score==null?'-':Number(x.score).toFixed(4)}</td><td>${x.artifact_dir?'可查看':'-'}</td></tr>`).join('')}catch(e){document.querySelector('#health').textContent='error';document.querySelector('#health').className='bad';console.error(e)}}load();</script></body></html>
