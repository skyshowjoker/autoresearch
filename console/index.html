<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoQuant Research Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--panel:#121c27;--panel2:#182635;--line:#2b4054;--text:#e8eef5;--muted:#91a4b7;--accent:#4ba3ff;--good:#65d391;--bad:#ff7b72}
*{box-sizing:border-box}body{font:14px/1.5 system-ui,-apple-system,sans-serif;margin:0;background:radial-gradient(circle at 15% 0,#18314a 0,#0b1118 42%);color:var(--text)}header{padding:28px clamp(18px,5vw,56px);border-bottom:1px solid var(--line);background:#101b27e8}header h1{margin:0 0 4px;font-size:24px;letter-spacing:.2px}main{padding:28px clamp(18px,5vw,56px);max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 24px #0002}.card strong{display:block;font-size:26px;margin-top:6px}.muted{color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:22px}table{width:100%;border-collapse:collapse;min-width:760px;background:var(--panel)}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #26394b}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}tr:hover{background:#213447}code{color:#9fd9ff}.ok{color:var(--good)}.bad{color:var(--bad)}button{font:inherit;background:#1e6fb8;color:#fff;border:1px solid #4a9de0;border-radius:7px;padding:7px 11px;cursor:pointer;transition:.15s}button:hover{background:#2c8ddd;transform:translateY(-1px)}.experiment-link{font-family:ui-monospace,monospace;font-size:12px}#detail{position:fixed;inset:0;z-index:20;background:#02060bb8;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px}.detail-card{width:min(900px,96vw);max-height:88vh;background:#13202c;border:1px solid #3b5870;border-radius:16px;box-shadow:0 24px 80px #000b;overflow:auto;padding:20px}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.detail-head h2{margin:0;font-size:18px}.files{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.files button{background:#172c3d;border-color:#34546d;font-size:12px}pre{background:#080d12;border:1px solid #26394b;border-radius:9px;padding:16px;overflow:auto;max-height:540px;white-space:pre-wrap;word-break:break-word;margin:0}.modal-backdrop{position:fixed;inset:0;background:#02060bb8;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:min(1000px,96vw);max-height:90vh;background:#13202c;border:1px solid #3b5870;border-radius:16px;box-shadow:0 24px 80px #000b;overflow:hidden;display:flex;flex-direction:column}.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#182b3c}.modal header h2{font-size:16px;margin:0}.modal-close{background:transparent;border:0;font-size:24px;padding:0 6px;color:var(--muted)}.modal-body{padding:18px;overflow:auto}.preview-meta{color:var(--muted);font-size:12px;margin-bottom:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:20px}.modal{max-height:94vh}}
</style></head>
<body><header><h1>AutoQuant Research Lab</h1><div class="muted">实验轨迹 · 版本 lineage · 回测审计</div></header><main><div class="grid"><div class="card"><div class="muted">实验总数</div><strong id="count">-</strong></div><div class="card"><div class="muted">成功实验</div><strong id="success">-</strong></div><div class="card"><div class="muted">最佳分数</div><strong id="best">-</strong></div><div class="card"><div class="muted">服务状态</div><strong class="ok" id="health">checking</strong></div></div><div class="table-wrap"><table><thead><tr><th>实验</th><th>策略版本</th><th>状态</th><th>决策</th><th>分数</th><th>产物</th></tr></thead><tbody id="rows"></tbody></table></div><section id="detail"><div class="detail-card"><div class="detail-head"><h2 id="detailTitle"></h2><button id="closeDetail" type="button">关闭</button></div><div id="files" class="files"></div></div></section></main><div id="previewModal" class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><header><h2 id="modalTitle">产物预览</h2><button class="modal-close" id="closeModal" type="button" aria-label="关闭">×</button></header><div class="modal-body"><div id="previewMeta" class="preview-meta"></div><pre id="preview">选择文件查看内容</pre></div></div></div>
<script>
const state = {experimentId: null};
function showError(message){document.querySelector('#preview').textContent='加载失败：'+message;}
async function preview(id, file){
  try {
    const encoded = file.split('/').map(encodeURIComponent).join('/');
    const response = await fetch('/api/experiments/'+encodeURIComponent(id)+'/artifacts/'+encoded);
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || response.statusText);
    document.querySelector('#modalTitle').textContent = file;
    document.querySelector('#previewMeta').textContent = payload.kind === 'text' ? '文本预览 · '+payload.size+' 字节' : '二进制文件 · '+payload.size+' 字节';
    document.querySelector('#preview').textContent = payload.kind === 'text' ? payload.content : '该文件暂不支持在线内容预览，可通过接口下载。';
    document.querySelector('#previewModal').style.display='flex';
  } catch (error) { showError(error.message); document.querySelector('#previewModal').style.display='flex'; }
}
async function detail(id){
  try {
    const response = await fetch('/api/experiments/'+encodeURIComponent(id)+'/artifacts');
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || response.statusText);
    state.experimentId = id;
    document.querySelector('#detail').style.display='flex';
    document.querySelector('#detailTitle').textContent='实验产物：'+id;
    document.querySelector('#files').innerHTML = (payload.items || []).map(file => '<button type="button" data-file="'+encodeURIComponent(file)+'">'+file+'</button>').join('');
    document.querySelector('#preview').textContent='选择文件查看内容';
  } catch (error) { showError(error.message); }
}
document.querySelector('#rows').addEventListener('click', event => { const button = event.target.closest('[data-experiment]'); if (button) detail(button.dataset.experiment); });
document.querySelector('#files').addEventListener('click', event => { const button = event.target.closest('[data-file]'); if (button) preview(state.experimentId, decodeURIComponent(button.dataset.file)); });
document.querySelector('#closeDetail').addEventListener('click', () => { document.querySelector('#detail').style.display='none'; });
document.querySelector('#detail').addEventListener('click', event => { if (event.target.id === 'detail') event.currentTarget.style.display='none'; });
document.querySelector('#closeModal').addEventListener('click', () => { document.querySelector('#previewModal').style.display='none'; });
document.querySelector('#previewModal').addEventListener('click', event => { if (event.target.id === 'previewModal') event.currentTarget.style.display='none'; });
document.addEventListener('keydown', event => { if (event.key === 'Escape') document.querySelector('#previewModal').style.display='none'; });
async function load(){
  try {
    const health = await (await fetch('/api/health')).json(); document.querySelector('#health').textContent=health.status;
    const data=(await (await fetch('/api/experiments')).json()).items||[];
    document.querySelector('#count').textContent=data.length;
    const good=data.filter(item=>item.status==='success'); document.querySelector('#success').textContent=good.length;
    document.querySelector('#best').textContent=good.length?Math.max(...good.map(item=>item.score??-Infinity)).toFixed(4):'-';
    document.querySelector('#rows').innerHTML=data.map(item=>'<tr><td><button type="button" data-experiment="'+item.experiment_id+'">'+item.experiment_id+'</button></td><td>'+item.strategy_version_id+'</td><td class="'+(item.status==='success'?'ok':'bad')+'">'+item.status+'</td><td>'+(item.decision||'-')+'</td><td>'+(item.score==null?'-':Number(item.score).toFixed(4))+'</td><td>'+(item.artifact_dir?'可查看':'-')+'</td></tr>').join('');
  } catch (error) { document.querySelector('#health').textContent='error'; document.querySelector('#health').className='bad'; showError(error.message); }
}
load();
</script></body></html>
