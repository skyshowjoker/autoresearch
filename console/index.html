<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoQuant · Research Lab</title>
<style>
:root{color-scheme:dark;--bg:#08111c;--surface:#0e1a28;--surface-2:#132337;--surface-3:#1a2c42;--line:#243a52;--text:#edf5ff;--muted:#8ea4bb;--blue:#62b0ff;--blue-strong:#368de0;--green:#5dd694;--amber:#f7c76b;--red:#ff7e7e;--shadow:0 20px 60px #0005}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(900px 520px at 12% -8%,#173b5b 0,transparent 65%),radial-gradient(700px 420px at 100% 0,#1a294b 0,transparent 60%),var(--bg)}button,input,select{font:inherit}button{cursor:pointer}header.topbar{height:72px;border-bottom:1px solid #ffffff0d;background:#08111ccc;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,64px);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#78c6ff,#3279d5);display:grid;place-items:center;color:#061321;font-weight:900;box-shadow:0 6px 20px #398fe355}.brand h1{font-size:16px;letter-spacing:.3px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.top-actions{display:flex;align-items:center;gap:10px}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid #31526e;background:#102438;padding:6px 10px;border-radius:999px;color:#b8d8f4;font-size:12px}.status i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #5dd69422}.status.bad i{background:var(--red);box-shadow:0 0 0 4px #ff7e7e22}.btn{border:1px solid #365976;background:#14293d;color:#dceeff;border-radius:9px;padding:8px 12px;transition:.18s}.btn:hover{background:#1d3c59;border-color:#5488b0;transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#398fdd,#276bc2);border-color:#68b6ff;color:#fff}.btn.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:16px}.page{max-width:1440px;margin:auto;padding:42px clamp(18px,5vw,64px) 56px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.eyebrow{color:var(--blue);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700}.hero h2{font-size:32px;line-height:1.15;margin:8px 0 8px;letter-spacing:-.5px}.hero p{color:var(--muted);margin:0;max-width:610px}.hero-actions{display:flex;gap:10px;flex-shrink:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:linear-gradient(145deg,#14263a,#0d1a29);border:1px solid var(--line);border-radius:15px;padding:17px 18px;box-shadow:0 9px 30px #0002}.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#1b3852;color:var(--blue);font-size:13px}.stat-value{font-size:27px;font-weight:700;letter-spacing:-.5px;margin-top:9px}.stat-note{font-size:11px;color:var(--muted);margin-top:3px}.workspace{border:1px solid var(--line);border-radius:17px;background:#0d1927dd;box-shadow:var(--shadow);overflow:hidden}.workspace-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.workspace-title{display:flex;align-items:center;gap:10px}.workspace-title h3{margin:0;font-size:16px}.count-pill{color:#a7c4dc;background:#1a3045;border:1px solid #2e4b64;border-radius:999px;padding:2px 8px;font-size:11px}.filters{display:flex;align-items:center;gap:9px}.search{position:relative}.search span{position:absolute;left:11px;top:7px;color:#7891a8}.search input,.filters select{height:34px;border:1px solid #2c485f;background:#0c1825;color:var(--text);border-radius:8px;padding:0 10px}.search input{width:230px;padding-left:30px}.filters select{min-width:112px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:13px 20px;border-bottom:1px solid #ffffff0b;white-space:nowrap}th{color:#7891a8;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;background:#102033}tbody tr{transition:.15s}tbody tr:hover{background:#172d43}tbody tr:last-child td{border-bottom:0}.experiment-btn{border:0;background:none;padding:0;color:#a8d7ff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.experiment-btn:hover{color:#fff;text-decoration:underline}.strategy{color:#bdd0e3}.protocol{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#7fa4c1}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:600}.badge.success{background:#123b2b;color:#7ce0a5}.badge.discard{background:#3c2e19;color:#f6c66b}.badge.baseline{background:#1e3448;color:#9bc9ee}.badge.crash,.badge.invalid,.badge.timeout{background:#442526;color:#ff9999}.score{font-variant-numeric:tabular-nums;font-weight:600}.artifact-link{color:#87c8ff;background:#142d43;border:1px solid #2b5677;border-radius:7px;padding:5px 9px;font-size:11px}.artifact-link:hover{background:#1c4260}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.empty-icon{font-size:30px;opacity:.7;margin-bottom:7px}.empty strong{display:block;color:#d5e4f2;margin-bottom:4px}.loading-row td{height:58px}.skeleton{height:11px;border-radius:5px;background:linear-gradient(90deg,#172b3e,#25435c,#172b3e);background-size:200% 100%;animation:load 1.4s infinite}@keyframes load{to{background-position:-200% 0}}.toast{position:fixed;right:24px;bottom:24px;background:#183049;border:1px solid #3d6381;color:#e5f3ff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:60}.modal-backdrop{position:fixed;inset:0;background:#020812c9;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal{width:min(960px,96vw);max-height:88vh;background:#102031;border:1px solid #3c5b76;border-radius:18px;box-shadow:0 30px 100px #000b;overflow:hidden;display:flex;flex-direction:column}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 20px;border-bottom:1px solid #ffffff12;background:#152b40}.modal-title{min-width:0}.modal-title h2{font-size:16px;margin:0;overflow:hidden;text-overflow:ellipsis}.modal-title p{font-size:11px;color:var(--muted);margin:2px 0 0}.close{width:32px;height:32px;border:0;border-radius:8px;background:#ffffff0b;color:#aac1d3;font-size:21px;line-height:1}.close:hover{background:#ffffff18;color:#fff}.modal-body{padding:20px;overflow:auto}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.file-btn{min-height:66px;text-align:left;border:1px solid #2a475f;background:#10263a;color:#dceeff;border-radius:11px;padding:11px 12px;transition:.16s}.file-btn:hover{border-color:#66b4ef;background:#183b58;transform:translateY(-1px)}.file-icon{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:6px;background:#1d4665;color:#8dcbfa;font-size:11px;margin-right:7px}.file-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;margin-top:7px}.file-hint{font-size:10px;color:#7898b2}.preview-meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:11px}.preview-content{margin:0;background:#08111a;border:1px solid #29445c;border-radius:10px;padding:16px;overflow:auto;max-height:58vh;white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cce5f8}.modal-preview{z-index:40}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.hero-actions{width:100%}}@media(max-width:640px){header.topbar{padding:0 16px}.brand small{display:none}.page{padding:28px 14px 40px}.hero h2{font-size:26px}.top-actions .status{display:none}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:22px}.workspace-head{align-items:flex-start;flex-direction:column;padding:15px}.filters{width:100%}.search,.search input{width:100%}.filters select{flex:0 0 112px}th,td{padding:12px 14px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">AQ</div><div><h1>AutoQuant Research Lab</h1><small>策略研究与回测工作台</small></div></div><div class="top-actions"><div id="serviceStatus" class="status"><i></i><span>连接中</span></div><button id="refreshBtn" class="btn icon" type="button" aria-label="刷新">↻</button></div></header>
<main class="page"><section class="hero"><div><div class="eyebrow">Research workspace</div><h2>实验总览</h2><p>集中查看策略实验、评分决策和可审计产物。点击实验 ID 查看完整 lineage 与文件。</p></div><div class="hero-actions"><button id="refreshHero" class="btn primary" type="button">刷新数据 <span>↻</span></button></div></section>
<section class="stats"><div class="stat"><div class="stat-head"><span>实验总数</span><span class="stat-icon">◈</span></div><div id="count" class="stat-value">—</div><div class="stat-note">当前研究库</div></div><div class="stat"><div class="stat-head"><span>成功实验</span><span class="stat-icon">✓</span></div><div id="success" class="stat-value">—</div><div class="stat-note">已通过执行协议</div></div><div class="stat"><div class="stat-head"><span>最佳分数</span><span class="stat-icon">★</span></div><div id="best" class="stat-value">—</div><div class="stat-note">开发集最高 score</div></div><div class="stat"><div class="stat-head"><span>数据更新时间</span><span class="stat-icon">◷</span></div><div id="updated" class="stat-value" style="font-size:18px">—</div><div class="stat-note">本次页面刷新</div></div></section>
<section class="workspace"><div class="workspace-head"><div class="workspace-title"><h3>实验记录</h3><span id="visibleCount" class="count-pill">0 条</span></div><div class="filters"><label class="search"><span>⌕</span><span class="sr-only">搜索实验</span><input id="search" type="search" placeholder="搜索实验或策略…"></label><select id="statusFilter" aria-label="按状态筛选"><option value="all">全部状态</option><option value="success">成功</option><option value="discard">已丢弃</option><option value="baseline">基线</option><option value="crash">失败</option></select></div></div><div class="table-scroll"><table><thead><tr><th>实验 / 时间</th><th>策略版本</th><th>状态</th><th>决策</th><th>评分</th><th>协议</th><th>产物</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" style="display:none"><div class="empty-icon">⌁</div><strong>没有匹配的实验</strong><span>调整搜索词或状态筛选后重试。</span></div></div></section></main>
<div id="detailModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal"><div class="modal-head"><div class="modal-title"><h2 id="detailTitle">实验产物</h2><p id="detailSubtitle">加载中…</p></div><button id="closeDetail" class="close" type="button" aria-label="关闭">×</button></div><div class="modal-body"><div id="files" class="file-grid"></div></div></div></div>
<div id="previewModal" class="modal-backdrop modal-preview" role="dialog" aria-modal="true" aria-labelledby="previewTitle"><div class="modal"><div class="modal-head"><div class="modal-title"><h2 id="previewTitle">文件预览</h2><p id="previewMeta">—</p></div><button id="closePreview" class="close" type="button" aria-label="关闭">×</button></div><div class="modal-body"><pre id="preview" class="preview-content">选择文件查看内容</pre></div></div></div><div id="toast" class="toast" role="status"></div>
<script>
const state={experiments:[],experimentId:null};
const $=selector=>document.querySelector(selector);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const statusLabel={success:'成功',discard:'已丢弃',baseline:'基线',crash:'失败',invalid:'无效',timeout:'超时'};
const decisionLabel={keep:'保留',discard:'丢弃',baseline:'基线',crash:'失败',invalid:'无效',timeout:'超时'};
function notify(message){$('#toast').textContent=message;$('#toast').style.display='block';clearTimeout(state.toast);state.toast=setTimeout(()=>$('#toast').style.display='none',2800)}
function formatDate(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.getTime())?String(value).slice(0,16):date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function iconFor(file){const suffix=file.split('.').pop().toLowerCase();return suffix==='json'||suffix==='jsonl'?'{}':suffix==='py'?'PY':suffix==='parquet'?'▦':suffix==='csv'?'▤':'·'}
function renderStats(){const data=state.experiments;const good=data.filter(item=>item.status==='success');const scores=good.map(item=>Number(item.score)).filter(Number.isFinite);$('#count').textContent=data.length;$('#success').textContent=good.length;$('#best').textContent=scores.length?Math.max(...scores).toFixed(4):'—';$('#updated').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function renderRows(){const query=$('#search').value.trim().toLowerCase();const filter=$('#statusFilter').value;const data=state.experiments.filter(item=>{const text=[item.experiment_id,item.strategy_version_id,item.protocol_id,item.decision,item.status].join(' ').toLowerCase();return(!query||text.includes(query))&&(filter==='all'||item.status===filter||item.decision===filter)});$('#visibleCount').textContent=data.length+' 条';$('#empty').style.display=data.length?'none':'block';$('#rows').innerHTML=data.map(item=>{const status=item.status||'unknown';const decision=item.decision||'—';return '<tr><td><button type="button" class="experiment-btn" data-experiment="'+escapeHtml(item.experiment_id)+'">'+escapeHtml(item.experiment_id)+'</button><div class="muted">'+formatDate(item.created_at)+'</div></td><td class="strategy">'+escapeHtml(item.strategy_version_id||'—')+'</td><td><span class="badge '+escapeHtml(status)+'">● '+escapeHtml(statusLabel[status]||status)+'</span></td><td>'+escapeHtml(decisionLabel[decision]||decision)+'</td><td class="score">'+(item.score==null?'—':Number(item.score).toFixed(4))+'</td><td class="protocol">'+escapeHtml(String(item.protocol_id||'').slice(0,12)||'—')+'</td><td>'+(item.artifact_dir?'<button type="button" class="artifact-link" data-experiment="'+escapeHtml(item.experiment_id)+'">查看产物</button>':'—')+'</td></tr>'}).join('')}
function openModal(element){element.style.display='flex';document.body.style.overflow='hidden'}function closeModal(element){element.style.display='none';if(!document.querySelector('.modal-backdrop[style*="display: flex"]'))document.body.style.overflow=''}
async function openDetail(id){state.experimentId=id;openModal($('#detailModal'));$('#detailTitle').textContent='实验产物 · '+id;$('#detailSubtitle').textContent='正在读取文件清单…';$('#files').innerHTML='<div class="skeleton" style="height:66px"></div><div class="skeleton" style="height:66px"></div>';try{const response=await fetch('/api/experiments/'+encodeURIComponent(id)+'/artifacts');const payload=await response.json();if(!response.ok)throw new Error(payload.error||response.statusText);$('#detailSubtitle').textContent=(payload.items||[]).length+' 个文件 · 点击文件预览';$('#files').innerHTML=(payload.items||[]).map(file=>'<button type="button" class="file-btn" data-file="'+encodeURIComponent(file)+'"><span><span class="file-icon">'+iconFor(file)+'</span>'+escapeHtml(file.split('/').pop())+'</span><span class="file-name">'+escapeHtml(file)+'</span><span class="file-hint">点击查看内容</span></button>').join('')||'<div class="empty">该实验暂无产物文件。</div>'}catch(error){$('#detailSubtitle').textContent='加载失败';$('#files').innerHTML='<div class="empty">'+escapeHtml(error.message)+'</div>';notify('产物加载失败')}}
async function previewFile(file){try{const encoded=file.split('/').map(encodeURIComponent).join('/');const response=await fetch('/api/experiments/'+encodeURIComponent(state.experimentId)+'/artifacts/'+encoded);const payload=await response.json();if(!response.ok)throw new Error(payload.error||response.statusText);$('#previewTitle').textContent=file.split('/').pop();$('#previewMeta').textContent=(payload.kind==='text'?'文本文件':'二进制文件')+' · '+payload.size+' 字节';$('#preview').textContent=payload.kind==='text'?payload.content:'该文件暂不支持在线内容预览。';openModal($('#previewModal'))}catch(error){$('#preview').textContent='加载失败：'+error.message;openModal($('#previewModal'))}}
async function load(){const button=$('#refreshBtn');button.textContent='…';try{const [healthResponse,experimentResponse]=await Promise.all([fetch('/api/health'),fetch('/api/experiments')]);const health=await healthResponse.json();const experiments=await experimentResponse.json();state.experiments=experiments.items||[];$('#serviceStatus').className='status';$('#serviceStatus span').textContent=health.status==='ok'?'服务正常':'服务异常';renderStats();renderRows()}catch(error){$('#serviceStatus').className='status bad';$('#serviceStatus span').textContent='连接失败';notify('无法加载实验数据')}finally{button.textContent='↻'}}
$('#rows').addEventListener('click',event=>{const button=event.target.closest('[data-experiment]');if(button)openDetail(button.dataset.experiment)});$('#files').addEventListener('click',event=>{const button=event.target.closest('[data-file]');if(button)previewFile(decodeURIComponent(button.dataset.file))});$('#search').addEventListener('input',renderRows);$('#statusFilter').addEventListener('change',renderRows);$('#refreshBtn').addEventListener('click',load);$('#refreshHero').addEventListener('click',load);$('#closeDetail').addEventListener('click',()=>closeModal($('#detailModal')));$('#closePreview').addEventListener('click',()=>closeModal($('#previewModal')));$('#detailModal').addEventListener('click',event=>{if(event.target.id==='detailModal')closeModal(event.currentTarget)});$('#previewModal').addEventListener('click',event=>{if(event.target.id==='previewModal')closeModal(event.currentTarget)});document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal($('#previewModal'));closeModal($('#detailModal'))}});load();
</script>
</body>
</html>
